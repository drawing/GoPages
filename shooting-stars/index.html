<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="流星打字：敲落每一颗星。字母下落消除小游戏。">
<title>流星打字</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23070d24'/%3E%3Cpath%20d='M16%203l3.9%209.1%209.9.8-7.5%206.5%202.3%209.6L16%2023.8%207.4%2029l2.3-9.6L2.2%2012.9l9.9-.8z'%20fill='%23ffd700'/%3E%3C/svg%3E">
<style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #070d24;
    }

    body {
        color: #e8ecff;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }

    #game-container { position: fixed; inset: 0; }
    /* manipulation 关掉双击缩放（6e）：触屏连点星星是玩法，不是缩放页面的手势 */
    #game-container canvas { display: block; touch-action: manipulation; }

    /* 首屏占位：Phaser 本体约 1.2MB，下载期间不能白屏 */
    #splash {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(180deg, #070d24 0%, #1b2a5e 42%, #5b3f7d 74%, #e8845c 100%);
        transition: opacity .4s ease;
    }

    #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(1.6px 1.6px at 14% 16%, #fff, transparent),
            radial-gradient(1.4px 1.4px at 28% 32%, #fde68a, transparent),
            radial-gradient(1.8px 1.8px at 43% 12%, #fff, transparent),
            radial-gradient(1.2px 1.2px at 61% 26%, #fff, transparent),
            radial-gradient(1.6px 1.6px at 76% 15%, #fde68a, transparent),
            radial-gradient(1.3px 1.3px at 88% 34%, #fff, transparent),
            radial-gradient(1.5px 1.5px at 20% 48%, #fff, transparent),
            radial-gradient(1.2px 1.2px at 52% 44%, #fff, transparent),
            radial-gradient(1.7px 1.7px at 70% 52%, #fff, transparent),
            radial-gradient(1.3px 1.3px at 92% 60%, #fde68a, transparent);
        opacity: .55;
        animation: ss-twinkle 4.5s ease-in-out infinite;
    }

    #splash.is-hidden { opacity: 0; pointer-events: none; }

    .splash-star {
        position: relative;
        width: 62px;
        height: 62px;
        background: linear-gradient(160deg, #ffffff 0%, #ffd700 55%, #f6ad55 100%);
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        filter: drop-shadow(0 0 18px rgba(255, 215, 0, .55));
        animation: ss-spin 7s linear infinite;
    }

    .splash-title {
        position: relative;
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: .3em;
        text-indent: .3em;
        color: #fff;
        text-shadow: 0 2px 18px rgba(7, 13, 36, .8);
    }

    .splash-note {
        position: relative;
        margin: 0;
        font-size: 13px;
        letter-spacing: .16em;
        color: rgba(232, 236, 255, .72);
    }

    .splash-bar {
        position: relative;
        width: 220px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, .16);
        overflow: hidden;
    }

    .splash-bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #63b3ed, #ffd700, #fc8181);
        animation: ss-slide 1.25s ease-in-out infinite;
    }

    #fatal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: auto;
        background: radial-gradient(120% 90% at 50% 0%, #16204a 0%, #070d24 70%);
        scrollbar-width: thin;
        scrollbar-color: #5b3f7d #0d1430;
    }

    #fatal[hidden] { display: none; }
    #fatal::-webkit-scrollbar { width: 10px; }
    #fatal::-webkit-scrollbar-track { background: #0d1430; }
    #fatal::-webkit-scrollbar-thumb { background: #5b3f7d; border-radius: 6px; border: 2px solid #0d1430; }
    #fatal::-webkit-scrollbar-thumb:hover { background: #7d5aa3; }

    .fatal-card {
        width: min(440px, 100%);
        padding: 28px 30px 26px;
        border: 1px solid rgba(246, 173, 85, .32);
        border-radius: 18px;
        background: linear-gradient(160deg, rgba(27, 42, 94, .92), rgba(10, 16, 42, .96));
        box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    }

    .fatal-card h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: .06em;
        color: #f6ad55;
    }

    .fatal-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.75; color: rgba(232, 236, 255, .86); }

    .fatal-detail {
        display: block;
        margin: 14px 0 20px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(7, 13, 36, .7);
        border: 1px solid rgba(99, 179, 237, .22);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        color: #9ae6b4;
        word-break: break-all;
    }

    .fatal-card button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 26px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .08em;
        color: #2d3748;
        background: linear-gradient(120deg, #ffd700, #f6ad55);
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease;
        box-shadow: 0 8px 22px rgba(246, 173, 85, .28);
    }

    .fatal-card button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(246, 173, 85, .4); }
    .fatal-card button:active { transform: translateY(0); }

    noscript .fatal-card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; }

    @keyframes ss-spin { to { transform: rotate(360deg); } }
    @keyframes ss-twinkle { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
    @keyframes ss-slide { 0% { left: -42%; } 100% { left: 102%; } }

    @media (prefers-reduced-motion: reduce) {
        .splash-star, .splash-bar span, #splash::before { animation: none; }
        .splash-bar span { left: 0; width: 100%; }
    }
</style>
<script>
    window.ShootingStarsFatal = function (detail) {
        var splash = document.getElementById('splash');
        var fatal = document.getElementById('fatal');
        if (splash) { splash.classList.add('is-hidden'); }
        if (!fatal) { return; }
        if (detail) { fatal.querySelector('[data-detail]').textContent = detail; }
        fatal.hidden = false;
    };
    window.__ssWatchdog = window.setTimeout(function () {
        if (typeof window.Phaser === 'undefined') {
            window.ShootingStarsFatal('等待 cdn.jsdelivr.net 超过 15 秒，可能是网络被拦截。');
        }
    }, 15000);
</script>
</head>
<body>
    <div id="game-container"></div>

    <div id="splash">
        <div class="splash-star"></div>
        <p class="splash-title">流星打字</p>
        <div class="splash-bar"><span></span></div>
        <p class="splash-note">正在加载引擎</p>
    </div>

    <div id="fatal" hidden>
        <div class="fatal-card">
            <h1>星空没能点亮</h1>
            <p>无法加载 Phaser，请检查网络后重试。游戏引擎来自公共 CDN，离线或内网环境下会被拦截。</p>
            <span class="fatal-detail" data-detail>https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js</span>
            <button type="button" onclick="location.reload()">重新加载</button>
        </div>
    </div>

    <noscript>
        <div class="fatal-card">
            <h1>需要 JavaScript</h1>
            <p>流星打字是一个跑在浏览器里的小游戏，请开启 JavaScript 后重新加载本页。</p>
        </div>
    </noscript>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"
            integrity="sha384-AvQiDMZAVLda3VtAoU5MCfBz8pzXhteb2CiUJeKBmPlWzpXj1uJ96Km11+YuFNu/"
            crossorigin="anonymous" referrerpolicy="no-referrer"
            onerror="window.ShootingStarsFatal('脚本请求失败：cdn.jsdelivr.net 不可达。')"></script>
    <script>
        (function () {
            window.clearTimeout(window.__ssWatchdog);
            if (typeof window.Phaser === 'undefined') {
                window.ShootingStarsFatal('Phaser 未定义：CDN 脚本未能执行。');
                return;
            }

            // classic script 按依赖顺序执行（async=false 保序），不用 ES modules，file:// 双击也能跑
            var files = [
                'src/config.js',
                'src/utils/display.js',
                'src/utils/tween.js',
                'src/utils/ui.js',
                'src/utils/letters.js',
                'src/utils/sequence.js',
                'src/utils/touch.js',
                'src/utils/debug.js',
                'src/systems/SpawnDirector.js',
                'src/systems/ScoreKeeper.js',
                'src/systems/Storage.js',
                'src/systems/Settings.js',
                'src/systems/AudioSys.js',
                'src/objects/Backdrop.js',
                'src/objects/HUD.js',
                'src/objects/Star.js',
                'src/objects/StarPool.js',
                'src/objects/TrailPool.js',
                'src/objects/Effects.js',
                'src/objects/Countdown.js',
                'src/scenes/BootScene.js',
                'src/scenes/MenuScene.js',
                'src/scenes/TutorialScene.js',
                'src/scenes/GameScene.js',
                'src/scenes/PauseScene.js',
                'src/scenes/GameOverScene.js',
                'src/main.js'
            ];

            files.forEach(function (file, index) {
                var tag = document.createElement('script');
                tag.src = file;
                tag.async = false;
                tag.onerror = function () { window.ShootingStarsFatal('脚本加载失败：' + file); };
                if (index === files.length - 1) {
                    tag.onload = function () { window.ShootingStars.start(); };
                }
                document.body.appendChild(tag);
            });
        })();
    </script>
</body>
</html>
