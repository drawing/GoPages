<!DOCTYPE html>
<html lang="zh-CN"
      data-accent="ink"
      data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 · 闲亩</title>
<meta name="description" content="">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/chroma.css">
<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var cfg = 'light';
    var t = saved || cfg;
    if (t === 'auto') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (!saved) {
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                root.dataset.theme = e.matches ? 'dark' : 'light';
            });
        }
    }
    root.dataset.theme = t;
})();
</script>

</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="site-title" href="/">
            <span class="seal" aria-hidden="true">闲</span>闲亩
        </a>
        <nav>
            <a href="/">首页</a>
            
            
            
            <a href="/archives/">归档</a>
            
            
            
            <a href="/categories/">分类</a>
            
            
            
            <a href="/tags/">标签</a>
            
            
            
            <a href="/search/" class="active">搜索</a>
            
            <button id="theme-toggle" type="button" aria-label="切换深浅色模式">
                <span class="when-dark">浅色</span><span class="when-light">深色</span>
            </button>
        </nav>
    </div>
</header>

<main class="container">

<h1 class="page-title">搜索</h1>
<input type="search" id="search-input" placeholder="输入关键词搜索文章…" autocomplete="off" autofocus>
<p id="search-status" class="search-status"></p>
<ul id="search-results" class="post-list"></ul>

</main>
<footer class="site-footer">
    <div class="container">
        <span>© 2020–2026 闲亩</span>
        
        <a href="https://github.com/drawing/" target="_blank" rel="me noopener">GitHub</a>
        
        <span>Powered by <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a></span>
    </div>
</footer>

<script src="/js/theme.js" defer></script>

<script src="/js/search.js" defer data-index="/search/index.json"></script>

</body>
</html>
